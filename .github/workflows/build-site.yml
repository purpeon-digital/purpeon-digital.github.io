name: Build site

# Shared build job for ci.yml (PRs) and deploy.yml (main). Self-hosted is fine
# here BECAUSE this job carries no secrets — build steps execute project code
# (Astro SSG), so credential-bearing steps live in the callers' deploy jobs on
# throwaway runners. Secrets never share a machine with project-code execution.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The self-hosted runner is an older Xeon without AVX2, which the
          # default Bun build requires. The baseline variant targets CPUs
          # without it. `latest` still resolves to the newest release, so this
          # pins the build variant, not the version.
          bun-download-url: "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64-baseline.zip"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:run

      - name: Build site
        run: bun run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1
          include-hidden-files: true
