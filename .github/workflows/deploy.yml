name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-site.yml

  deploy-cloudflare:
    needs: build
    # Gated on the account var so the pipeline degrades gracefully before
    # Cloudflare is configured; a missing token then fails loudly at wrangler.
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    # Throwaway runner with the Cloudflare token; runs no project code.
    # Serves workers.dev during the soak, production after the DNS cutover.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy config
        uses: actions/checkout@v7
        with:
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.126.0 deploy
