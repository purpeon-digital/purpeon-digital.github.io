name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-site.yml
    with:
      upload-pages: true

  deploy-pages:
    # Production today. Retires in the Phase 4 cutover after the Cloudflare
    # deploy has soaked. Runs on a throwaway runner — the OIDC-minting token
    # never touches the self-hosted build machine.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    needs: build
    # Gated on the account var so the pipeline degrades gracefully before
    # Cloudflare is configured; a missing token then fails loudly at wrangler.
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    # Throwaway runner with the Cloudflare token; runs no project code.
    # Serves workers.dev during the soak, production after the DNS cutover.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy config
        uses: actions/checkout@v7
        with:
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.126.0 deploy
