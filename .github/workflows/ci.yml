name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-site.yml

  deploy-staging:
    needs: build
    # Gated on the account var so the pipeline degrades gracefully before
    # Cloudflare is configured; a missing token then fails loudly at wrangler.
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    # Throwaway runner: holds the Cloudflare token, runs NO project code —
    # deploy config comes from the TRUSTED main ref, only dist/ from the PR.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy config from main
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy staging preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.126.0 versions upload --preview-alias "pr-${{ github.event.number || 'manual' }}"
