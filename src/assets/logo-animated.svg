<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38"
     class="pd-lockup" role="img" aria-label="Purpeon Digital">
  <style>
    /* Everything is scoped under .pd-lockup and the keyframes are prefixed, so this
       file is safe both on its own and inlined into a page next to other stylesheets. */
    .pd-lockup {
      --ring-dur:   975ms;
      --fox-start: calc(var(--ring-dur) * .742);  /* see the note on the comet easing */
      --draw1:     1575ms;   /* the pen's whole run around the silhouette */
      --fill:       495ms;   /* outline gives way to solid */
      /* Every separate piece is drawn at the moment the pen goes past it. Each fraction
         is a position along the silhouette's LENGTH, converted through the ease-in-out
         curve into a fraction of TIME, which is what a delay wants. The durations are
         each piece's own length over the pen's LOCAL speed there, written as fractions
         of --draw1 so a change of speed rescales them for free.
             eye 19.9% along   ear 26.3%   inner ear 34.2%   neck 46.4%            */
      --t-eye:   calc(var(--fox-start) + var(--draw1) * 0.3091);
      --t-ear:   calc(var(--fox-start) + var(--draw1) * 0.3552);
      --t-inner: calc(var(--fox-start) + var(--draw1) * 0.4063);
      --t-back:  calc(var(--fox-start) + var(--draw1) * 0.4794);
      --dur-eye:   calc(var(--draw1) * 0.0501);
      --dur-ear:   calc(var(--draw1) * 0.0799);
      --dur-inner: calc(var(--draw1) * 0.0798);
      --dur-back:  calc(var(--draw1) * 0.1012);
      --t2: calc(var(--fox-start) + var(--draw1));   /* outline complete, ink comes up */
    }

    .pd-lockup .ring {
      fill: none; stroke: #bb33bb; stroke-width: 0.45; stroke-linecap: round;
      /* pathLength=100 renormalises the circumference, so 5 means 5% of the ring.
         The gap must exceed the path length: a dash pattern repeats in BOTH directions,
         and a gap of 100 would park a stub on the start point at each end of the run.
         Inkscape's renderer ignores pathLength; browsers honour it. */
      stroke-dasharray: 5 200;
      stroke-dashoffset: -102;
      animation: pd-comet var(--ring-dur) cubic-bezier(.45,.05,.35,1) both;
    }
    /* -102 -> 7 runs backwards along the path, i.e. anticlockwise. The leading edge
       reaches the junction when the offset hits 0: that is 93.6% of the OFFSET RANGE
       but only 74.2% of the DURATION, because the easing is not linear. --fox-start is
       a fraction of duration, so it is pinned to the latter. Re-solve it if you change
       the timing function, or set the ring to linear and the two become the same. */
    @keyframes pd-comet { from { stroke-dashoffset: -102; } to { stroke-dashoffset: 7; } }

    /* Outline layer. The head silhouette is re-cut to start at the bottom of the chest,
       the lowest-right ink in the mark, and reversed so the pen climbs the jaw to the
       snout and on up the profile. */
    .pd-lockup .line path {
      fill: none; stroke: #bb33bb; stroke-width: 0.45;
      stroke-linejoin: round; stroke-linecap: round;
      opacity: 0;                       /* if animations never run, only the solid shows */
    }
    .pd-lockup .ln-sil   { stroke-dasharray: 146; stroke-dashoffset: 146;
                animation: pd-drawIn var(--draw1) ease-in-out var(--fox-start) both,
                           pd-lineOut var(--fill) linear      var(--t2)        both; }
    .pd-lockup .ln-eye   { stroke-dasharray: 10;   stroke-dashoffset: 10;
                animation: pd-drawIn var(--dur-eye)   linear var(--t-eye)   both,
                           pd-lineOut var(--fill)     linear var(--t2)      both; }
    .pd-lockup .ln-ear   { stroke-dasharray: 18;   stroke-dashoffset: 18;
                animation: pd-drawIn var(--dur-ear)   linear var(--t-ear)   both,
                           pd-lineOut var(--fill)     linear var(--t2)      both; }
    .pd-lockup .ln-inner { stroke-dasharray: 19;  stroke-dashoffset: 19;
                animation: pd-drawIn var(--dur-inner) linear var(--t-inner) both,
                           pd-lineOut var(--fill)     linear var(--t2)      both; }
    .pd-lockup .ln-back  { stroke-dasharray: 26;  stroke-dashoffset: 26;
                animation: pd-drawIn var(--dur-back)  linear var(--t-back)  both,
                           pd-lineOut var(--fill)     linear var(--t2)      both; }
    @keyframes pd-drawIn  { to { stroke-dashoffset: 0; } }
    @keyframes pd-lineOut { from { opacity: 1; } to { opacity: 0; } }

    /* Solid layer. The outline finishes in one pass, so every part inks together.
       NB: .ink-head keeps the FORWARD winding. Reversing a subpath flips its winding,
       and under fill-rule: nonzero that turns the eye and inner ear from holes into
       solid shapes. Only the stroked twin may be reversed. */
    .pd-lockup .ink path { opacity: 1; animation: pd-inkIn var(--fill) ease-out var(--t2) both; }
    @keyframes pd-inkIn { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .pd-lockup .ring, .pd-lockup .line { display: none; }
      .pd-lockup .ink path { animation: none; opacity: 1; }
    }
  </style>

  <!-- r and rotate are solved, not chosen: this is the exact point where the fox's
       pen touches down, so the comet finishes where the drawing begins -->
  <circle class="ring" cx="19.0" cy="19.0" r="14.8222" pathLength="100"
          transform="rotate(74.823 19.0 19.0)"/>

